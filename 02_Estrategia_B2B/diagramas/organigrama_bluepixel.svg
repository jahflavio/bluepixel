    <text x="355" y="111" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">DIRECCIÓN GENERAL</text>
    <text x="245" y="133" font-family="sans-serif" font-size="14" font-weight="700" fill="#93c5fd">María</text>
    <text x="245" y="148" font-family="sans-serif" font-size="10.5" fill="#94a3b8">CEO / Visión Estratégica &amp; Video</text>

    <!-- Leo -->
