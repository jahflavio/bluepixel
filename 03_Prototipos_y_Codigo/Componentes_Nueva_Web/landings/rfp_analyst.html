<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BluePixel | RFP & Tender Analyst Agent</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              750: '#1a2235',
              800: '#151b2b',
              850: '#0f1420',
              900: '#0a0d14',
              950: '#05070a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-navy-950 text-slate-200 font-sans antialiased selection:bg-blue-500/30">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Componente: Navbar Minimalista (Fricción Cero)
    const Navbar = () => (
      <nav className="border-b border-white/[0.08] bg-navy-950/85 backdrop-blur-xl sticky top-0 z-50 px-6 py-4">
        <div className="max-w-5xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-500/30">
              BP
            </div>
            <div className="flex flex-col">
              <span className="text-white font-black tracking-tight text-lg leading-none">BluePixel</span>
              <span className="text-[10px] text-slate-400 font-mono tracking-wider">BLUEPRINT LIBRARY</span>
            </div>
          </div>
          <div className="flex items-center">
            <a href="../index.html#capabilities" className="hidden md:flex text-slate-400 hover:text-white font-mono text-xs items-center gap-2 mr-6 transition-colors">&larr; Ver Directorio</a>
            <button onClick={() => document.getElementById('contact-form').scrollIntoView()} className="bg-white text-navy-950 hover:bg-slate-200 font-bold text-xs px-5 py-2.5 rounded-xl transition-all shadow-lg">
              Diagnóstico de Viabilidad
            </button>
          </div>
        </div>
      </nav>
    );

    // Pilar 1: Hero Agresivo
    const Hero = () => (
      <section className="relative pt-24 pb-16 px-6 overflow-hidden">
        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/20 via-navy-950 to-navy-950"></div>
        <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-12 relative z-10">
          <div className="flex-1 text-left">
            <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-500/10 border border-blue-500/20 mb-6">
              <span className="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
              <span className="text-[10px] font-mono font-bold tracking-widest text-blue-400 uppercase">Arquitectura Operativa Lista para Producci&oacute;n</span>
            </div>
            
            <h1 className="text-5xl md:text-6xl font-black text-white tracking-tight leading-[1.05] mb-6">
              Deja de perder licitaciones por falta de tiempo.
            </h1>
            
            <p className="text-lg md:text-xl text-slate-400 mb-10 leading-relaxed">
              Instala nuestro <strong>RFP & Tender Analyst Agent</strong>. Un flujo aut&oacute;nomo que lee licitaciones de 200 p&aacute;ginas, genera la matriz de cumplimiento y pre-redacta tu propuesta t&eacute;cnica en 4 horas.
            </p>

            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
              <button onClick={() => document.getElementById('contact-form').scrollIntoView()} className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg px-8 py-4 rounded-xl shadow-xl shadow-blue-600/20 transition-all flex items-center justify-center gap-2">
                Agendar Demo Técnico <i data-lucide="arrow-right" className="w-5 h-5"></i>
              </button>
              <p className="text-xs text-slate-500 font-mono mt-3 sm:mt-0">SLA 99.9% &middot; Despliegue Dedicado</p>
            </div>
            
            {/* Trust Badges */}
            <div className="mt-12 pt-8 border-t border-white/10 flex items-center gap-6 opacity-60 grayscale">
               <span className="text-xs font-mono font-bold tracking-widest uppercase text-slate-500">Despliegue Seguro:</span>
               <div className="flex items-center gap-4 text-white font-bold">AWS</div>
               <div className="flex items-center gap-4 text-white font-bold">AZURE</div>
               <div className="flex items-center gap-4 text-white font-bold">SOC2</div>
            </div>
          </div>
          
          <div className="flex-1 w-full relative">
            <div className="absolute inset-0 bg-blue-500/20 blur-[100px] rounded-full"></div>
            <div className="bg-navy-900 border border-white/10 rounded-2xl p-4 shadow-2xl relative z-10 overflow-hidden group h-64 md:h-96 flex items-center justify-center">
                <i data-lucide="server" className="w-24 h-24 text-blue-500/20 group-hover:text-blue-500/40 transition-colors"></i>
                <div className="absolute bottom-4 left-4 right-4 bg-navy-950/80 backdrop-blur-sm border border-white/10 rounded-lg p-3 text-xs font-mono text-emerald-400">
                    &gt; STATUS: ONLINE<br/>
                    &gt; CLOUD: PRIVATE TIER<br/>
                    &gt; LATENCY: 12ms
                </div>
            </div>
          </div>
        </div>
      </section>
    );

    // Pilar 2: Workflow Teardown (Cómo funciona)
    const WorkflowTeardown = () => (
      <section className="py-20 px-6 bg-navy-900 border-y border-white/[0.05]">
        <div className="max-w-5xl mx-auto">
          <div className="text-center mb-16">
            <h2 className="text-3xl font-bold text-white mb-4">Arquitectura del Agente Licitador</h2>
            <p className="text-slate-400">No es "ChatGPT". Es un Pipeline RAG seguro conectado a tu historial corporativo.</p>
          </div>

          <div className="grid md:grid-cols-3 gap-6 relative">
            <div className="hidden md:block absolute top-1/2 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-blue-500/50 to-transparent -translate-y-1/2 z-0"></div>
            
            {/* Paso 1 */}
            <div className="bg-navy-850 p-8 rounded-2xl border border-white/10 relative z-10 shadow-2xl hover:border-blue-500/50 transition-colors">
              <div className="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400 mb-6 font-mono font-bold text-xl border border-blue-500/30">1</div>
              <h3 className="text-xl font-bold text-white mb-2">Ingesta Masiva</h3>
              <p className="text-sm text-slate-400 leading-relaxed">Sube el PDF de la licitaci&oacute;n del gobierno o corporativo. El agente lee las 200 p&aacute;ginas en segundos usando OCR avanzado.</p>
            </div>

            {/* Paso 2 */}
            <div className="bg-navy-850 p-8 rounded-2xl border border-white/10 relative z-10 shadow-2xl hover:border-indigo-500/50 transition-colors">
              <div className="w-12 h-12 rounded-xl bg-indigo-500/20 flex items-center justify-center text-indigo-400 mb-6 font-mono font-bold text-xl border border-indigo-500/30">2</div>
              <h3 className="text-xl font-bold text-white mb-2">Cruce Hist&oacute;rico (RAG)</h3>
              <p className="text-sm text-slate-400 leading-relaxed">Busca en tu historial de propuestas ganadoras y extrae los textos t&eacute;cnicos, certificaciones y CVs necesarios para cumplir.</p>
            </div>

            {/* Paso 3 */}
            <div className="bg-navy-850 p-8 rounded-2xl border border-white/10 relative z-10 shadow-2xl hover:border-emerald-500/50 transition-colors">
              <div className="w-12 h-12 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400 mb-6 font-mono font-bold text-xl border border-emerald-500/30">3</div>
              <h3 className="text-xl font-bold text-white mb-2">Redacci&oacute;n y Matriz</h3>
              <p className="text-sm text-slate-400 leading-relaxed">Emite un documento Word con la propuesta pre-llenada al 80% y un Excel con la matriz de cumplimiento exacta.</p>
            </div>
          </div>
        </div>
      </section>
    );

    // Pilar 3: ROI Calculator Simple
    const ROICalculator = () => {
      const [rfps, setRfps] = useState(5);
      const hoursPerRfp = 40; // Promedio de horas humanas por RFP
      const hourlyRate = 50; // Costo por hora USD
      
      const currentCost = rfps * hoursPerRfp * hourlyRate;
      const newCost = rfps * 4 * hourlyRate; // 4 horas con agente
      const savings = currentCost - newCost;

      return (
        <section className="py-24 px-6">
          <div className="max-w-4xl mx-auto bg-gradient-to-br from-navy-850 to-navy-900 rounded-3xl border border-white/10 p-8 md:p-12 shadow-2xl">
            <h2 className="text-3xl font-bold text-white mb-8 text-center">Calculadora de Impacto Financiero</h2>
            
            <div className="mb-10">
              <label className="block text-sm font-mono text-slate-400 mb-4 text-center">&iquest;Cu&aacute;ntas licitaciones complejas respondes al mes?</label>
              <input 
                type="range" min="1" max="20" value={rfps} 
                onChange={(e) => setRfps(parseInt(e.target.value))}
                className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
              />
              <div className="text-center mt-4 text-3xl font-bold text-blue-400">{rfps} Unidades</div>
            </div>

            <div className="grid md:grid-cols-2 gap-6">
              <div className="bg-navy-950 p-6 rounded-2xl border border-red-500/20">
                <div className="text-sm text-slate-500 mb-1">Costo Actual (Humano)</div>
                <div className="text-3xl font-mono text-red-400">${currentCost.toLocaleString()} USD/mes</div>
                <div className="text-xs text-slate-500 mt-2">({rfps * hoursPerRfp} horas invertidas)</div>
              </div>
              <div className="bg-navy-950 p-6 rounded-2xl border border-emerald-500/30">
                <div className="text-sm text-emerald-500/70 mb-1 font-bold">Ahorro con Agente BluePixel</div>
                <div className="text-4xl font-mono text-emerald-400 font-bold">+${savings.toLocaleString()} USD</div>
                <div className="text-xs text-slate-400 mt-2">ROI operativo recuperado al instante.</div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    // Pilar 4 y 5: Engineering Leadership & Contact Form (Fricción Cero)
    const ContactAndTrust = () => (
      <section id="contact-form" className="py-24 px-6 bg-navy-950">
        <div className="max-w-5xl mx-auto grid md:grid-cols-2 gap-16 items-center">
          
          {/* Trust / Liderazgo */}
          <div>
            <h2 className="text-3xl md:text-4xl font-black text-white mb-6">Agenda una revisión de factibilidad.</h2>
            <p className="text-slate-400 mb-8 leading-relaxed">
              No hablarás con un ejecutivo de cuenta junior. Tu sesión será liderada directamente por un Arquitecto Cloud que evaluará la seguridad de tus datos y la viabilidad técnica del despliegue en tus servidores (AWS/Azure/GCP).
            </p>
            
            <div className="bg-navy-900 border border-white/10 rounded-2xl p-6 flex items-center gap-4">
              <div className="w-16 h-16 rounded-full bg-slate-800 overflow-hidden border-2 border-slate-700 flex items-center justify-center text-white text-2xl font-bold">
                P
              </div>
              <div>
                <div className="text-white font-bold text-lg">Pablo Gómez</div>
                <div className="text-slate-400 text-sm font-mono">Lead Enterprise Architect</div>
              </div>
            </div>
          </div>

          {/* Formulario Fricción Cero */}
          <div className="bg-navy-900 border border-white/[0.08] p-8 rounded-3xl shadow-2xl relative">
            <div className="absolute -top-3 -right-3">
              <span className="flex h-6 w-6">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-6 w-6 bg-emerald-500"></span>
              </span>
            </div>
            
            <h3 className="text-xl font-bold text-white mb-6">Solicitar Arquitectura en Private Cloud</h3>
            
            <form className="space-y-4" onSubmit={(e) => { e.preventDefault(); window.dataLayer && window.dataLayer.push({'event': 'lead_form_submitted'}); alert('Lead capturado en Webhook/MCP'); }}>
              <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1.5 uppercase">Nombre</label>
                    <input type="text" required placeholder="Tu nombre" className="w-full bg-navy-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors placeholder:text-slate-600" />
                  </div>
                  <div>
                    <label className="block text-xs font-mono text-slate-400 mb-1.5 uppercase">Teléfono / WP</label>
                    <input type="tel" placeholder="+52..." className="w-full bg-navy-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors placeholder:text-slate-600" />
                  </div>
              </div>
              <div>
                <label className="block text-xs font-mono text-slate-400 mb-1.5 uppercase">Correo Corporativo</label>
                <input type="email" required placeholder="cto@empresa.com" className="w-full bg-navy-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors placeholder:text-slate-600" />
              </div>
              <div>
                <label className="block text-xs font-mono text-slate-400 mb-1.5 uppercase">Tamaño del Equipo</label>
                <select className="w-full bg-navy-950 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                  <option>10 - 50 empleados</option>
                  <option>50 - 200 empleados</option>
                  <option>200+ empleados</option>
                </select>
              </div>
              <button className="w-full bg-white text-navy-950 hover:bg-slate-200 font-bold text-base px-6 py-4 rounded-xl transition-all shadow-xl mt-4">
                Validar Despliegue →
              </button>
              <p className="text-[10px] text-slate-500 text-center mt-4">Tus datos están protegidos por protocolo LFPDPPP.</p>
            </form>
          </div>
          
        </div>
      </section>
    );

    // App Component
    const App = () => {
      useEffect(() => {
        lucide.createIcons();
      }, []);

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar />
          <Hero />
          <WorkflowTeardown />
          <ROICalculator />
          <ContactAndTrust />
          <footer className="py-8 text-center text-xs font-mono text-slate-600 border-t border-white/[0.05]">
            © 2026 BluePixel B2B. FutureProof Engineering.
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
