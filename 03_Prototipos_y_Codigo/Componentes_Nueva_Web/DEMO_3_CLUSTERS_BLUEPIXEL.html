      const val = document.getElementById('rag-input').value.toLowerCase();
      const out = document.getElementById('rag-output');
      if (val.includes('contraseña') || val.includes('password') || val.includes('servidor')) {
        out.className = 'p-3 rounded-xl bg-rose-950/40 border border-rose-500/40 text-rose-300 font-mono text-xs';

      } else {
        out.className = 'p-3 rounded-xl bg-[#03060F] border border-emerald-500/30 text-emerald-300 font-mono text-xs';
        out.innerHTML = '<div class="font-bold">✔ Respuesta RAG Validada: El Diagnóstico FutureProof de BluePixel tiene una duración cerrada de 2 a 4 semanas a precio fijo. No cobramos horas abiertas.</div><div class="text-[10px] text-slate-400 mt-1">Fuente: Política Comercial BluePixel v4.2 (Gobernanza Cero Riesgo)</div>';
