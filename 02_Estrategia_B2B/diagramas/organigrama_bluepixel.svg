  <text x="500" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Dirección General, Growth &amp; RevOps, Comercial (Ventas vs Cuentas), Producto &amp; UX, e Infraestructura Web</text>

  <!-- C-Level Executives -->
