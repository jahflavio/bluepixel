    <text x="370" y="437" font-family="sans-serif" font-size="10" fill="#e0f2fe">• Elimina el revisor humano manual en la madrugada</text>
    <text x="370" y="452" font-family="sans-serif" font-size="10" fill="#e0f2fe">• Valida SKUs, precios de convenio, inventario físico y crédito</text>
    <text x="370" y="466" font-family="sans-serif" font-size="9" fill="#7dd3fc">Auto-aprobación verde inmediata sin despertar administrativos</text>

    <!-- Module E: Optimizador de Rutas y Horarios -->
    <rect x="355" y="486" width="340" height="78" rx="8" fill="#2d1a04" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="370" y="508" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#fde68a">🚚 Despachador de Rutas y Horarios con GPS</text>
    <text x="370" y="525" font-family="sans-serif" font-size="10" fill="#fef3c7">• Asignación de mensajero más cercano según tráfico CDMX</text>
    <text x="370" y="540" font-family="sans-serif" font-size="10" fill="#fef3c7">• Agrupación horaria de cirugías programadas (ahorro gasolina)</text>
    <text x="370" y="554" font-family="sans-serif" font-size="9" fill="#fcd34d">Link con tiempo de vuelo / llegada exacto al quirófano</text>

    <!-- Module F: Living SOPs & Copiloto Interno -->
    <rect x="355" y="574" width="340" height="92" rx="8" fill="#18181b" stroke="#71717a" stroke-width="1.2"/>
    <text x="370" y="595" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e4e4e7">📚 Living SOPs &amp; Wiki Bot de Procesos</text>
    <text x="370" y="612" font-family="sans-serif" font-size="10" fill="#d4d4d8">• El software guía el proceso paso a paso (cero Word empolvado)</text>
    <text x="370" y="627" font-family="sans-serif" font-size="10" fill="#d4d4d8">• Wiki bot interno por WhatsApp: responde dudas a empleados en 3s</text>
    <text x="370" y="642" font-family="sans-serif" font-size="10" fill="#d4d4d8">• Sellos oficiales de Registro Sanitario COFEPRIS en PDF</text>
    <text x="370" y="656" font-family="sans-serif" font-size="9" fill="#a1a1aa">Elimina la dependencia del conocimiento tribal de veteranos</text>
  </g>

