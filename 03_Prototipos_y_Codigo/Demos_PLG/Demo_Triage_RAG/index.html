<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluePixel | Triage RAG Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { navy: { 900: '#0a0d14', 950: '#05070a' } } }
            }
        }
    </script>
</head>
<body class="bg-navy-950 text-slate-200 font-sans h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="border-b border-white/10 bg-navy-950 p-4 shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i> Volver a Demos</a>
                <span class="text-white font-bold ml-4">Triage RAG-Blindado (Simulador L1)</span>
            </div>
            <div class="text-xs font-mono text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded bg-emerald-500/10">SLA: 99.9% Active</div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6 min-h-0">
        
        <!-- Left: UI (WhatsApp Simulator) -->
        <div class="bg-slate-900 border border-white/10 rounded-2xl flex flex-col overflow-hidden shadow-2xl relative">
            <!-- Header -->
            <div class="bg-emerald-600 p-4 flex items-center gap-3 text-white shrink-0">
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </div>
                <div>
                    <h3 class="font-bold leading-tight">Soporte Corporativo L1</h3>
                    <p class="text-xs opacity-80">Agente RAG BluePixel • En línea</p>
                </div>
            </div>
            
            <!-- Chat Box -->
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-[#efeae2] flex flex-col gap-3">
                <!-- Messages will be injected here -->
            </div>

            <!-- Input -->
            <form id="chat-form" class="p-3 bg-slate-100 flex gap-2 shrink-0">
                <input type="text" id="user-input" class="flex-1 rounded-full px-4 py-2 border-none focus:ring-2 focus:ring-emerald-500 text-slate-900" placeholder="Escribe un mensaje..." autocomplete="off">
                <button type="submit" class="w-10 h-10 bg-emerald-600 text-white rounded-full flex items-center justify-center hover:bg-emerald-700 transition-colors">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <!-- Right: Technical Logs (The "Black Box" exposed) -->
        <div class="bg-[#0c0c0c] border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-2xl font-mono text-xs">
            <div class="bg-slate-900 border-b border-slate-800 p-3 flex justify-between items-center shrink-0">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                </div>
                <div class="text-slate-500">/var/log/bluepixel-rag-agent.log</div>
                <i class="fa-solid fa-terminal text-slate-500"></i>
            </div>
            <div id="terminal-box" class="flex-1 p-4 overflow-y-auto text-emerald-400 flex flex-col gap-1 whitespace-pre-wrap">
                <div class="text-slate-500">[INFO] Inicializando Motor RAG... OK</div>
                <div class="text-slate-500">[INFO] Conectado a Pinecone Vector DB. Index: 45,912 chunks.</div>
                <div class="text-slate-500">[INFO] Esperando Webhook de Meta API...</div>
            </div>
        </div>

    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const terminalBox = document.getElementById('terminal-box');

        const knowledgeBase = {
            "precio": "Nuestros servicios B2B comienzan en $10,000 USD mensuales dependiendo de la arquitectura requerida.",
            "horario": "Nuestro equipo de ingeniería en la nube opera 24/7 con esquema Follow-the-Sun.",
            "seguridad": "Cumplimos estrictamente con el marco OWASP y LFPDPPP, garantizando cifrado end-to-end de tu data."
        };

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `max-w-[80%] p-3 rounded-lg text-sm shadow-sm ${isUser ? 'bg-[#d9fdd3] ml-auto rounded-tr-none text-slate-900' : 'bg-white mr-auto rounded-tl-none text-slate-900'}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addLog(text, level = "INFO") {
            const div = document.createElement('div');
            let color = "text-emerald-400";
            if (level === "WARN") color = "text-yellow-400";
            if (level === "ERROR") color = "text-red-400";
            if (level === "DEBUG") color = "text-blue-400";
            
            const timestamp = new Date().toISOString().split('T')[1].substring(0,8);
            div.className = color;
            div.innerHTML = `<span class="text-slate-600">[${timestamp}]</span> <span class="font-bold">[${level}]</span> ${text}`;
            terminalBox.appendChild(div);
            terminalBox.scrollTop = terminalBox.scrollHeight;
        }

        // Initial greeting
        setTimeout(() => {
            addMessage("Hola. Soy el Agente de Soporte L1. Puedo resolver dudas operativas basadas en nuestra documentación pública.");
            addLog("Webhook recibido. Sesión iniciada: +52XXXXXXXXXX", "INFO");
        }, 500);

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if(!text) return;
            
            addMessage(text, true);
            userInput.value = '';
            
            // Simulating RAG Pipeline Logs
            addLog(`Recibido Payload Inbound: {"text": "${text.substring(0,20)}..."}`, "DEBUG");
            
            setTimeout(() => {
                addLog(`Ejecutando Sentiment Analysis: score=0.82 (Neutral)`, "INFO");
            }, 300);

            setTimeout(() => {
                addLog(`Vectorizando Input y consultando embeddings en BD...`, "DEBUG");
            }, 700);

            setTimeout(() => {
                const lower = text.toLowerCase();
                let response = "Lo siento, mi configuración RAG estricta me impide responder a eso porque no se encuentra en el manual corporativo. ¿Deseas que transfiera este ticket a un ingeniero de soporte L2?";
                let logMsg = `Umbral de confianza < 0.85. Bloqueando alucinación.`;
                let logLevel = "WARN";

                if(lower.includes("precio") || lower.includes("costo")) {
                    response = knowledgeBase["precio"];
                    logMsg = "Match en Vector DB (0.94 score). Recuperando chunk: pricing_policy.md";
                    logLevel = "INFO";
                } else if(lower.includes("horario") || lower.includes("hora")) {
                    response = knowledgeBase["horario"];
                    logMsg = "Match en Vector DB (0.91 score). Recuperando chunk: sla_terms.md";
                    logLevel = "INFO";
                } else if(lower.includes("seguridad") || lower.includes("datos")) {
                    response = knowledgeBase["seguridad"];
                    logMsg = "Match en Vector DB (0.98 score). Recuperando chunk: compliance_gdpr.md";
                    logLevel = "INFO";
                }

                addLog(logMsg, logLevel);
                
                setTimeout(() => {
                    addLog(`Enviando Respuesta Outbound a Meta API... OK`, "DEBUG");
                    addMessage(response);
                }, 300);

            }, 1200);
        });
    </script>
</body>
</html>
