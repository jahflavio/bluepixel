    <text x="780" y="560" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde047">📊 Contabilidad &amp; Finanzas</text>
    <text x="780" y="579" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Comisiones automáticas por vendedor</text>
    <text x="780" y="595" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• OCR de gasolina/casetas por WhatsApp</text>
    <text x="780" y="611" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Conciliación bancaria en 1 clic</text>
    <text x="780" y="628" font-family="sans-serif" font-size="9.5" fill="#facc15">Paz mental para la contadora</text>
