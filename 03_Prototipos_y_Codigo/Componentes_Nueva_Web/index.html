                    <form onSubmit={handleSubmitFinal} className="space-y-6 animate-fadeIn">
                      <div>
                        <h3 className="text-xl font-bold text-white mb-1">Cuello de botella & Consentimiento</h3>
                        <p className="text-slate-400 text-xs">Describe el proceso manual o fricción que deseas resolver con agentes o tecnología.</p>
                      </div>

                      <div>
                        <label className="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-2 font-medium">
                          ¿QUÉ PROCESO O FLUJO DE TRABAJO BUSCAS AUTOMATIZAR O AGENTIZAR?
                        </label>
                        <textarea
                          required
                          rows="4"
                          value={formData.workflow}
                          onChange={(e) => handleChange('workflow', e.target.value)}
                          placeholder="Ej. Queremos automatizar la generación de cotizaciones que hoy se hacen en Excel y tardan 48 horas, o conectar nuestro CRM con el ERP..."
                          className="w-full bg-navy-900 border border-white/15 rounded-xl p-4 text-white text-sm focus:outline-none focus:border-blue-500 transition-colors"
                        />
                      </div>

                      <div className="space-y-3 pt-2">
                        <label className="flex items-start gap-3 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={formData.consentData}
                            onChange={(e) => handleChange('consentData', e.target.checked)}
                            className="mt-1 w-4 h-4 rounded text-blue-600 bg-navy-900 border-white/20 focus:ring-0"
                          />
                          <span className="text-xs text-slate-400 leading-relaxed">
                            Acepto que BluePixel almacene y procese mis datos personales para responder a esta solicitud técnica, bajo estricto apego al <a href="#" className="underline text-blue-400">Aviso de Privacidad</a> y la LFPDPPP.
                          </span>
                        </label>

                        <label className="flex items-start gap-3 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={formData.consentNewsletter}
                            onChange={(e) => handleChange('consentNewsletter', e.target.checked)}
                            className="mt-1 w-4 h-4 rounded text-blue-600 bg-navy-900 border-white/20 focus:ring-0"
                          />
                          <span className="text-xs text-slate-400 leading-relaxed">
                            Deseo recibir ocasionalmente análisis técnicos y casos de estudio sobre ingeniería de agentes IA y arquitectura FutureProof. Puedo cancelar cuando lo desee.
                          </span>
                        </label>
                      </div>

                      <div className="pt-4 flex items-center justify-between gap-4">
                        <button
                          type="button"
                          onClick={handleBack}
                          className="bg-navy-750 hover:bg-navy-700 text-slate-300 font-semibold text-sm px-6 py-3.5 rounded-full border border-white/10 transition-colors">
                          Atrás
                        </button>
                        <button
                          type="submit"
                          className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm px-8 py-3.5 rounded-full transition-all shadow-lg shadow-blue-600/30 flex items-center gap-2">
                          <span>Enviar Solicitud Técnica</span>
                          <span className="font-bold text-base">↗</span>
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              ) : (
                /* SUCCESS STATE */
                <div className="text-center py-12 animate-fadeIn">
                  <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl mx-auto mb-4">
                    ✓
                  </div>
                  <h4 className="text-2xl font-black text-white mb-2">Diagnóstico Recibido con Éxito</h4>
                  <p className="text-slate-300 text-sm max-w-md mx-auto leading-relaxed mb-8">
                    Gracias <strong className="text-white">{formData.fullName || 'por escribirnos'}</strong>. Un estratega de ingeniería de BluePixel revisará la viabilidad de <strong className="text-blue-300">{formData.company || 'tu empresa'}</strong> y te contactará en menos de 24 horas hábiles.
                  </p>
                  <button 
                    onClick={() => { setSubmitted(false); setStep(1); }}
                    className="bg-navy-750 hover:bg-navy-700 text-slate-300 text-xs font-semibold px-6 py-3 rounded-full border border-white/10 transition-colors">
                    Enviar otra consulta
                  </button>
                </div>
              )}

            </div>

          </div>
        </section>
      );
    };

    // Modal de Solución Técnica para el Prompt Bar
    const SolutionDrawer = ({ solution, onClose, onOpenContact }) => {
      if (!solution) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-6 bg-black/80 backdrop-blur-md animate-fadeIn">
          <div className="bg-navy-900 border border-blue-500/30 rounded-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl glow-agentic relative">
            <button
              onClick={onClose}
              className="absolute top-5 right-5 w-8 h-8 rounded-full bg-navy-800 text-slate-400 hover:text-white flex items-center justify-center border border-white/10 text-sm">
              ✕
            </button>

            <div className="mb-6">
              <span className="text-[11px] font-mono px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/25 uppercase tracking-widest font-semibold">
                {solution.categoria}
              </span>
              <h3 className="text-xl md:text-2xl font-black text-white mt-3 leading-snug">
                Arquitectura de Solución para tu Operación
              </h3>
              <p className="text-slate-300 text-sm mt-1.5 italic bg-navy-850 p-3 rounded-xl border border-white/[0.06]">
                "{solution.prompt}"
              </p>
            </div>

            <div className="mb-6 bg-red-500/10 border border-red-500/25 rounded-xl p-4">
              <div className="text-red-400 text-xs font-mono font-bold uppercase tracking-wider mb-1">
                ⚠ Fricción Operativa & Costo de Inacción
              </div>
              <p className="text-white text-sm font-medium">{solution.impacto}</p>
            </div>

            <div className="mb-6">
              <h4 className="text-xs font-mono text-slate-400 uppercase tracking-widest mb-3">
                ◈ Flujo de Trabajo Agentizado (Blueprint de Ingeniería)
              </h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {solution.arquitectura.map((p, idx) => (
                  <div key={idx} className="bg-navy-850 border border-white/[0.08] rounded-xl p-3.5">
                    <span className="text-blue-400 font-mono text-xs font-bold block mb-1">{p.paso}</span>
                    <p className="text-slate-300 text-xs leading-relaxed">{p.desc}</p>
                  </div>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
              <div className="bg-emerald-500/10 border border-emerald-500/25 rounded-xl p-4">
                <span className="text-emerald-400 font-mono text-[10px] uppercase font-bold tracking-wider block mb-1">
                  ✦ Caso Real Análogo en Producción
                </span>
                <p className="text-white text-xs font-medium leading-relaxed">{solution.casoAnalogo}</p>
              </div>
              <div className="bg-purple-500/10 border border-purple-500/25 rounded-xl p-4">
                <span className="text-purple-300 font-mono text-[10px] uppercase font-bold tracking-wider block mb-1">
                  ✦ Retorno Financiero Estimado
                </span>
                <p className="text-white text-xs font-medium leading-relaxed">{solution.roiEstimado}</p>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-white/[0.08]">
              <div className="text-xs font-mono text-slate-400">
                Implementación estimada: <strong className="text-white font-semibold">{solution.tiempoImplementacion}</strong>
              </div>
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <button onClick={onClose} className="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition-colors">
                  Cerrar
                </button>
                <button
                  onClick={() => { onClose(); onOpenContact(); }}
                  className="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-6 py-2.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                  <span>Solicitar Diagnóstico</span>
                  <span>→</span>
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    };

    // App Component Root
    const App = () => {
      const [selectedSolution, setSelectedSolution] = useState(null);

      const scrollToForm = (pkgName) => {
        const formEl = document.getElementById('contact-form');
        if (formEl) {
          formEl.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <div className="min-h-screen">
          <Navbar onOpenContact={() => scrollToForm()} />
          <HeroWithPrompt 
            onSelectSolution={(sol) => setSelectedSolution(sol)} 
            onOpenContact={() => scrollToForm()}
          />
          <SocialProofSection />
          <ThreeWaysToWork onSelectPackage={(pkg) => scrollToForm(pkg)} />
          <CapabilitiesElevated onSelectCapability={(cap) => scrollToForm(cap)} />
          <CaseStudiesSection onOpenCase={(client) => scrollToForm(client)} />
          <MultiStepContact />
          
          <SolutionDrawer 
            solution={selectedSolution} 
            onClose={() => setSelectedSolution(null)} 
            onOpenContact={() => scrollToForm()}
          />

          {/* Footer */}
          <footer className="py-12 px-6 border-t border-white/[0.08] text-center text-slate-500 text-xs font-mono bg-navy-950">
            <div className="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="font-bold text-white">BluePixel</span>
                <span>·</span>
                <span>Deep Tech & Agentic Engineering</span>
              </div>
              <div className="flex items-center gap-4 text-slate-400">
                <span>CDMX & Austin, TX</span>
                <span>·</span>
                <a href="mailto:hello@bluepixel.mx" className="hover:text-blue-400">hello@bluepixel.mx</a>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
