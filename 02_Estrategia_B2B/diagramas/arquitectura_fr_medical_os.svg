    <!-- Module A: Agente de Voz IA 24/7 -->
    <rect x="355" y="135" width="340" height="78" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="370" y="157" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#c7d2fe">🎙️ Agente de Voz IA 24/7 (Guardia Nocturna)</text>
    <text x="370" y="174" font-family="sans-serif" font-size="10" fill="#e0e7ff">• Conversación médica natural en español de México</text>
    <text x="370" y="189" font-family="sans-serif" font-size="10" fill="#e0e7ff">• Identifica cirujano, hospital, procedimiento y urgencia</text>
    <text x="370" y="203" font-family="sans-serif" font-size="9" fill="#a5b4fc">Despierta al mensajero de guardia solo si es Código Rojo</text>

    <!-- Module B: Triage Quirurgico NLP -->
    <rect x="355" y="222" width="340" height="78" rx="8" fill="#3f1118" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="370" y="244" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#fecdd3">🚨 Motor de Triage con NLP (Fin a Notas Libres)</text>
    <text x="370" y="261" font-family="sans-serif" font-size="10" fill="#ffe4e6">• Clasificación objetiva: Rojo (&lt; 2h), Amarillo (&lt; 6h), Verde</text>
    <text x="370" y="276" font-family="sans-serif" font-size="10" fill="#ffe4e6">• Detecta palabras críticas: "paciente en quirófano", "tórax inestable"</text>
    <text x="370" y="290" font-family="sans-serif" font-size="9" fill="#fda4af">Prioriza la orden al puesto #1 con borde rojo pulsante</text>

    <!-- Module C: Recomendador de Kits Anti-Vueltas -->
    <rect x="355" y="310" width="340" height="78" rx="8" fill="#14312e" stroke="#14b8a6" stroke-width="1.2"/>
    <text x="370" y="332" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#99f6e4">📦 Recomendador de Kits (Anti-Vueltas de Mensajeros)</text>
    <text x="370" y="349" font-family="sans-serif" font-size="10" fill="#ccfbf1">• Inferencia quirúrgica: placas Stracos + tornillos + instrumental</text>
    <text x="370" y="364" font-family="sans-serif" font-size="10" fill="#ccfbf1">• Añade kit de respaldo en consignación con QR de retorno</text>
    <text x="370" y="378" font-family="sans-serif" font-size="9" fill="#5eead4">El mensajero hace 1 solo viaje a quirófano en vez de 3</text>

    <!-- Module D: Validation Sentinel (Fin al Revisor Manual) -->
    <rect x="355" y="398" width="340" height="78" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
