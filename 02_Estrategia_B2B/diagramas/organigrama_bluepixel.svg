    <rect x="520" y="95" width="260" height="22" rx="10" fill="url(#execGrad)"/>
    <text x="650" y="111" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">PRODUCTO, TECH &amp; VENTAS</text>
