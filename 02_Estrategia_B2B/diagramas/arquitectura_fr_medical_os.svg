  <!-- Background Canvas -->
  <rect width="1050" height="720" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="525" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">ARQUITECTURA INTEGRAL: FR MEDICAL SURGICAL OS</text>
  <text x="525" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Sistema Operativo Quirúrgico, Logístico y Financiero con Servidores MCP de BluePixel</text>

  <!-- 3 MAIN HORIZONTAL LANES / COLUMNS -->

  <!-- COLUMN 1: CANALES DE ENTRADA 24/7 -->
  <g filter="url(#shadow)">
    <rect x="40" y="85" width="260" height="600" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="85" width="260" height="34" rx="14" fill="url(#blueGrad)"/>
    <text x="170" y="107" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1. CANALES DE ENTRADA 24/7</text>

    <!-- Card 1: Telefonía Conmutador -->
    <rect x="55" y="140" width="230" height="95" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="70" y="165" font-family="sans-serif" font-size="13" font-weight="700" fill="#93c5fd">📞 Telefonía &amp; Conmutador</text>
    <text x="70" y="184" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Atención al 3er timbrazo</text>
    <text x="70" y="200" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Guardia nocturna activa (12 AM - 7 AM)</text>
    <text x="70" y="216" font-family="sans-serif" font-size="9.5" fill="#38bdf8">Cero llamadas perdidas de cirujanos</text>

    <!-- Card 2: WhatsApp Urgencias -->
    <rect x="55" y="255" width="230" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="70" y="280" font-family="sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">💬 WhatsApp de Urgencias</text>
    <text x="70" y="299" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Pedidos de texto y notas de voz</text>
    <text x="70" y="315" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Envío de recetas y fotos de patología</text>
    <text x="70" y="331" font-family="sans-serif" font-size="9.5" fill="#34d399">Cotización PDF oficial en &lt; 60 seg</text>

    <!-- Card 3: Portal Web -->
    <rect x="55" y="370" width="230" height="95" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="70" y="395" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9">💻 Portal Web Quirúrgico</text>
    <text x="70" y="414" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Catálogo Stracos, Redax, Boston</text>
    <text x="70" y="430" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Cotizador 1-Click con clave SKU</text>
    <text x="70" y="446" font-family="sans-serif" font-size="9.5" fill="#22d3ee">Filtro B2B Hospitales vs Pacientes</text>

    <!-- Card 4: Fuerza de Ventas -->
    <rect x="55" y="485" width="230" height="95" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="1.2"/>
    <text x="70" y="510" font-family="sans-serif" font-size="13" font-weight="700" fill="#fde047">👔 Ejecutivos de Cuenta</text>
    <text x="70" y="529" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Levantamiento directo en hospital</text>
    <text x="70" y="545" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Registro guiado por SOP digital</text>
    <text x="70" y="561" font-family="sans-serif" font-size="9.5" fill="#facc15">Cero errores de captura</text>
  </g>

  <!-- COLUMN 2: CEREBRO MCP BLUEPIXEL (CENTRO) -->
  <g filter="url(#shadow)">
    <rect x="340" y="85" width="370" height="600" rx="14" fill="#09101d" stroke="#6366f1" stroke-width="2"/>
    <rect x="340" y="85" width="370" height="34" rx="14" fill="url(#purpleGrad)"/>
