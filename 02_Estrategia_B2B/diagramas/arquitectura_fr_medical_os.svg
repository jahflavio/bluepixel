    <text x="780" y="233" font-family="sans-serif" font-size="9.5" fill="#34d399">Ángeles, ABC, Médica Sur, INER</text>

    <!-- Target 2: Mensajería Propia -->
    <rect x="765" y="270" width="230" height="110" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="780" y="295" font-family="sans-serif" font-size="13" font-weight="700" fill="#67e8f9">🛵 Mensajeros Propios (PWA)</text>
    <text x="780" y="314" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Ruta verde optimizada en su móvil</text>
    <text x="780" y="330" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Alerta sonora en Código Rojo</text>
    <text x="780" y="346" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Check-in en puerta de quirófano</text>
    <text x="780" y="363" font-family="sans-serif" font-size="9.5" fill="#22d3ee">Cero vueltas dobles y menos gasolina</text>

    <!-- Target 3: ERP Bridge -->
    <rect x="765" y="400" width="230" height="115" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="780" y="425" font-family="sans-serif" font-size="13" font-weight="700" fill="#c4b5fd">🔄 ERP Sync Bridge</text>
    <text x="780" y="444" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Inyección de pedidos sin capturista</text>
    <text x="780" y="460" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Descarga de inventario en tiempo real</text>
    <text x="780" y="476" font-family="sans-serif" font-size="10.5" fill="#e2e8f0">• Bloqueo de stock comprometido</text>
    <text x="780" y="493" font-family="sans-serif" font-size="9.5" fill="#a78bfa">Listo para Facturar CFDI 4.0</text>

    <!-- Target 4: Contabilidad y Viáticos -->
